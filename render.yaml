services:
  - type: web
    name: kaizen-chat-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: N8N_GATEWAY_URL
        sync: false
      - key: GATEWAY_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
